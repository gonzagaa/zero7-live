<script>
(function () {
  var DESTINO = 'https://www.youtube.com/@zero7tesouraria/live/';
  var GA4_ID = 'G-K81WL9X541';
  var LIMITE_MS = 2000;   // nunca espera mais que isto pelos pixels
  var FOLGA_MS = 150;     // tempo para o navegador despachar os beacons

  var query = window.location.search || '';
  var alvo = DESTINO + query;
  var saiu = false;

  function redirecionar() {
    if (saiu) return;
    saiu = true;
    try { window.location.replace(alvo); } catch (e) { window.location.href = alvo; }
  }

  // Trava de segurança: aconteça o que acontecer, sai em 2s.
  setTimeout(redirecionar, LIMITE_MS);

  // Link manual (com a query) aparece depois de 3s
  try {
    document.getElementById('link-manual').href = alvo;
    setTimeout(function () { document.getElementById('manual').className += ' mostrar'; }, 3000);
  } catch (e) {}

  try {
    // ---- UTMs ----
    var params = new URLSearchParams(query);
    var CHAVES = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
    var utms = {};
    for (var k = 0; k < CHAVES.length; k++) {
      var v = params.get(CHAVES[k]);
      if (v) utms[CHAVES[k]] = v;
    }

    // ---- Espera: só redireciona quando tudo terminou (ou no limite) ----
    var pendentes = { meta: true, ga4: true, gtm: true };
    function concluir(nome) {
      if (!pendentes[nome]) return;
      delete pendentes[nome];
      for (var p in pendentes) return;
      setTimeout(redirecionar, FOLGA_MS);
    }

    // ---- GTM: evento customizado (o gestor precisa criar acionador/tag) ----
    window.dataLayer = window.dataLayer || [];
    var evGtm = { event: 'live_redirect', eventCallback: function () { concluir('gtm'); }, eventTimeout: LIMITE_MS - 200 };
    for (var c in utms) evGtm[c] = utms[c];
    window.dataLayer.push(evGtm);

    // ---- GA4: evento direto para a propriedade (via o Google Tag que o GTM carrega) ----
    // Enfileirado ANTES do GTM carregar: a tag GA4 do container envia o evento
    // assim que é configurada. (Empurrado depois disso, ou confiando no
    // event_callback, o evento se perde: o callback volta antes do envio.)
    // Por isso a confirmação é a própria requisição g/collect na Performance API.
    window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
    var evGa = { send_to: GA4_ID };
    for (var g in utms) evGa[g] = utms[g];
    window.gtag('event', 'live_redirect', evGa);
    (function esperarGa4() {
      if (saiu) return;
      try {
        var rs = performance.getEntriesByType('resource');
        for (var r = rs.length - 1; r >= 0; r--) {
          if (rs[r].name.indexOf('/g/collect') > -1 && rs[r].name.indexOf('en=live_redirect') > -1) { concluir('ga4'); return; }
        }
      } catch (e) { concluir('ga4'); return; }
      setTimeout(esperarGa4, 50);
    })();

    // ---- Meta: mesmo padrão do site principal (PageView com eventID + CAPI) + AcessoLive ----
    var eventID = '_' + Math.random().toString(36).slice(2, 11);

    function getFbp() {
      try {
        var existente = localStorage.getItem('_fbp');
        if (existente) return existente;
        var fbp = 'fb.1.' + Date.now() + '.' + Math.floor(Math.random() * 1e10);
        localStorage.setItem('_fbp', fbp);
        return fbp;
      } catch (e) { return ''; }
    }
    function getFbc() {
      var fbclid = params.get('fbclid');
      return fbclid ? 'fb.1.' + Date.now() + '.' + fbclid : '';
    }

    // Conversions API (backend próprio, igual ao site principal). keepalive
    // garante o envio mesmo com a página saindo.
    try {
      fetch('https://backend-api-zero7.vercel.app/api/send-event', {
        method: 'POST',
        keepalive: true,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event_name: 'PageView', event_id: eventID, fbp: getFbp(), fbc: getFbc(), email: 'anonimo@teste.com' })
      }).catch(function () {});
    } catch (e) {}

    // Enfileira já (o stub do fbq guarda até o fbevents.js chegar) e espera
    // a biblioteca carregar de verdade (callMethod) para liberar o redirect.
    try {
      fbq('track', 'PageView', {}, { eventID: eventID });
      fbq('trackCustom', 'AcessoLive', utms, { eventID: eventID + '-live' });
    } catch (e) {}
    var inicio = Date.now();
    (function esperarMeta() {
      if (saiu) return;
      if (window.fbq && typeof window.fbq.callMethod === 'function') {
        setTimeout(function () { concluir('meta'); }, 250);
        return;
      }
      if (Date.now() - inicio > LIMITE_MS) return; // bloqueado/adblock: a trava resolve
      setTimeout(esperarMeta, 50);
    })();
  } catch (e) {
    // Qualquer erro no rastreamento: não segura o usuário.
    redirecionar();
  }
})();
</script>
